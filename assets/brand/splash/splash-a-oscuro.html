html,body{width:100%;height:100%;overflow:hidden;font-family:Poppins,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
.grad{background:linear-gradient(90deg,#7c3aed,#0ea5e9 60%,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}

.bar{height:3px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#7c3aed,#0ea5e9,#06b6d4);animation:load 1.6s ease-in-out infinite}
.bar.det i{animation:none;transition:width .3s ease}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.logo{animation:in .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:scale(.85) rotate(-30deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}.bar i{animation-duration:3s}}

body{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line)}
h1{font-size:30px;font-weight:700;letter-spacing:-.3px;margin-top:18px}
.tag{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{width:220px;background:var(--track);margin-top:26px}
.status{font-size:10.5px;color:var(--dim);margin-top:8px}
.foot{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;font-size:10.5px;color:var(--dim)}
.foot b{color:var(--grp);font-weight:500;letter-spacing:2px}

:root{--line:#232638;--mut:#8a90a6;--dim:#6b7089;--track:#1e2133;--grp:#c9cce0}
body{background:radial-gradient(ellipse at 50% 35%,#1a1530 0%,#0b0d14 70%);color:#e8eaf0}</style></head><body><svg class="logo" width="112" height="112" viewBox="100 100 824 824" xmlns="http://www.w3.org/2000/svg"><circle cx="512" cy="512" r="356" fill="none" stroke="#7c3aed" stroke-width="22"/><line x1="203.7" y1="334.0" x2="820.3" y2="690.0" stroke="#a77bf3" stroke-opacity="1" stroke-width="16" stroke-linecap="round"/><line x1="203.7" y1="690.0" x2="820.3" y2="334.0" stroke="#06b6d4" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/><circle cx="512" cy="512" r="102" fill="#7c3aed"/><line x1="512.0" y1="156.0" x2="512.0" y2="868.0" stroke="#0ea5e9" stroke-opacity="0.95" stroke-width="16" stroke-linecap="round"/><circle cx="512.0" cy="156.0" r="57" fill="#0ea5e9"/><circle cx="820.3" cy="334.0" r="57" fill="#06b6d4"/><circle cx="820.3" cy="690.0" r="57" fill="#7c3aed"/><circle cx="512.0" cy="868.0" r="57" fill="#0ea5e9"/><circle cx="203.7" cy="690.0" r="57" fill="#06b6d4"/><circle cx="203.7" cy="334.0" r="57" fill="#7c3aed"/></svg><h1>Glyvex <span class="grad">AI Suite</span></h1><div class="tag">IA local, sin nube</div>
<div class="bar" id="bar"><i></i></div><div class="status" id="status">Iniciando servicios…</div>
<div class="foot"><span>by <b>GLYVEX GROUP</b></span><span id="ver">v0.5.0</span></div><script>
(function(){
  var st=document.getElementById('status'),ver=document.getElementById('ver'),bar=document.getElementById('bar');
  /* API para llamar desde Tauri: splash.eval("setSplashStatus('Cargando modelos…')") */
  window.setSplashStatus=function(t){if(st)st.textContent=t;};
  window.setSplashVersion=function(v){if(ver)ver.textContent=(String(v).charAt(0)==='v'?'':'v')+v;};
  /* p entre 0 y 1 -> barra determinada; null -> vuelve a animación indeterminada */
  window.setSplashProgress=function(p){if(!bar)return;
    if(p===null||p===undefined){bar.classList.remove('det');bar.firstElementChild.style.width='';return;}
    bar.classList.add('det');bar.firstElementChild.style.width=Math.max(0,Math.min(1,p))*100+'%';};
  var q=new URLSearchParams(location.search);
  if(q.get('v'))setSplashVersion(q.get('v'));
  if(q.get('p'))setSplashProgress(parseFloat(q.get('p')));
})();
</script></body></html>
