[package]
name = "glyvex-ai-suite"
version = "0.6.0"
description = "Glyvex AI Suite — shell desktop (Tauri 2) para la suite local de LLM"
authors = ["Fabian Acebey"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
