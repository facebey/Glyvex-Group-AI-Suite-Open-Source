[package]
name = "glyvex-ai-suite"
version = "0.8.0-beta"
description = "GlyvexAI Suite — shell desktop (Tauri 2) para la suite local de LLM"
authors = ["Fabian Acebey"]
edition = "2021"

[[bin]]
name = "glyvexai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
