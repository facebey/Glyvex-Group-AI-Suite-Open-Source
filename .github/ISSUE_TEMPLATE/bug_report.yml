name: Bug report
description: Report an error or unexpected behavior.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before submitting, check `docs/TROUBLESHOOTING.md`
        in case it is a known issue.
  - type: textarea
    id: descripcion
    attributes:
      label: Description
      description: What happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Steps to reproduce
      description: "1. Open...\n2. Tap...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: vista
    attributes:
      label: Affected view / module
      options:
        - Chat
        - Launcher
        - Benchmark
        - Monitor
        - Reports
        - Config
        - Other
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Glyvex-AI-Suite version
      description: E.g. 0.4.2 (see /api/info).
  - type: input
    id: backend
    attributes:
      label: Inference backend and build
      description: E.g. llama-server b11009 / Ollama 0.x / LM Studio.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: E.g. Windows 11 / Ubuntu 24.04.
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: E.g. RTX 3090 24GB, or "no GPU (CPU)".
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant logs (launcher, terminal). Check that there is no sensitive data.
