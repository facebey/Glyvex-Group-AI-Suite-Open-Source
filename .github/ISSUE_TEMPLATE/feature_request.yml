name: Feature request
description: Suggest an improvement or new functionality.
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problem it solves
      description: What do you want to achieve or what is holding you back today?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Proposal
      description: How you imagine it.
  - type: textarea
    id: alternativas
    attributes:
      label: Alternatives considered
      description: Other ways of solving it that you thought of.
  - type: dropdown
    id: local
    attributes:
      label: Keeps 100% local?
      description: The suite cannot depend on cloud, network, GPU or real models.
      options:
        - Yes
        - No / not sure
    validations:
      required: true
