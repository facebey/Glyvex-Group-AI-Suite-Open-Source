name: Windows NSIS

# T-1 T7.4: build del instalador NSIS firmado + latest.json en tags v*.
# Se SALTA (gris) si no existe el secret TAURI_SIGNING_PRIVATE_KEY: igual que
# linux-appimage.yml, el espejo public (sin secrets) no rompe al recibir tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    name: Gate (TAURI_SIGNING_PRIVATE_KEY presente?)
    runs-on: windows-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

  build-nsis:
    name: NSIS (Node 22)
    needs: [gate]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sin cache: npm (fix/actions-storage): cada hash del package-lock.json
      # genera una entrada ~40 MB no reemplazable en la cuota de storage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller analiza los imports del sidecar: necesita el app completo
      # importable en el entorno del build (igual que el workflow Linux).
      - name: Dependencias del backend (para el sidecar PyInstaller)
        run: python -m pip install --quiet -r requirements.txt pyinstaller

      - uses: dtolnay/rust-toolchain@stable

      # Sin Swatinem/rust-cache (fix/actions-storage): buscaba Cargo.lock en la
      # raiz (esta esta en src-tauri/) y solo dejaba markers de 777 B por tag;
      # el cache real de target/ pesaria cientos de MB contra la cuota.

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Sidecar + smoke (build.ps1)
        shell: pwsh
        run: .\build.ps1

      # El override de config DEBE ser un archivo: tauri-cli no acepta JSON
      # inline para localizar el proyecto (panico "Couldn't recognize the
      # current folder as a Tauri project" en el tag v0.9.0-beta, run
      # 38958676070). Se corre desde la raiz con el binario de frontend/,
      # igual que el build local validado en docs/RELEASE-CHECKLIST.md.
      - name: Build NSIS firmado
        shell: pwsh
        run: |
          Set-Content -Path ci-tauri-override.json -Value '{"build":{"beforeBuildCommand":null}}'
          frontend\node_modules\.bin\tauri.cmd build --ci --bundles nsis --config ci-tauri-override.json

      # latest.json: solo la entrada windows-x86_64 (el runner no tiene el
      # AppImage). Si la release lleva Linux, regenerar con
      # build-latest-json.ps1 -LinuxBundle <dir> (ver linux-appimage.yml).
      - name: latest.json
        shell: pwsh
        run: .\build-latest-json.ps1

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          # github.ref_name con "/" (dispatch a rama feature/...) rompe la
          # validación del nombre de artifact; en dispatch usamos run_id.
          name: glyvex-nsis-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          # 3 dias: el artifact de cada tag es ~92 MB con nombre unico (no se
          # reemplaza); con la retention default de 90 dias varios tags
          # saturaban la cuota de storage de la cuenta (0.5 GB).
          retention-days: 3

      - name: Nota de release
        shell: pwsh
        run: >
          Write-Host "::notice::Sube los artifacts (NSIS + .sig + latest.json)
          como assets de la release v*. Si hay AppImage Linux, regenera
          latest.json con build-latest-json.ps1 -LinuxBundle <dir> antes de
          subir."
