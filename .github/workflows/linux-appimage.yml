name: Linux AppImage

# RT-14 L2: build del AppImage + firma para el updater en tags v*.
# Se SALTA (gris) si no existe el secret TAURI_SIGNING_PRIVATE_KEY: asi el
# espejo public (sin secrets) no rompe al recibir tags.
# GitHub no permite secrets.X en if: (doc oficial), por eso el job gate
# expone un output y build-appimage condiciona contra needs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    name: Gate (TAURI_SIGNING_PRIVATE_KEY presente?)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # La expresión ${{ env.* }} SOLO ve env a nivel de workflow, no el env
        # del propio step (ese solo entra en el shell): se prueba por shell.
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-appimage:
    name: AppImage (Node 22)
    needs: [gate]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sin cache: npm (fix/actions-storage): cada hash del package-lock.json
      # genera una entrada ~40 MB no reemplazable en la cuota de storage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyInstaller analiza los imports del sidecar: necesita el app completo
      # importable en el entorno que corre el build (en el server era el venv).
      - name: Dependencias del backend (para el sidecar PyInstaller)
        run: python -m pip install --quiet -r requirements.txt pyinstaller

      - uses: dtolnay/rust-toolchain@stable

      # Sin Swatinem/rust-cache (fix/actions-storage): buscaba Cargo.lock en la
      # raiz (esta esta en src-tauri/) y solo dejaba markers de 777 B por tag;
      # el cache real de target/ pesaria cientos de MB contra la cuota.

      - name: Dependencias del sistema (webkit2gtk para Tauri + fuse para AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 libssl-dev pkg-config

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Build (sidecar + AppImage firmado)
        run: ./build-linux-appimage.sh

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          # github.ref_name con "/" (dispatch a rama feature/...) rompe la
          # validación del nombre de artifact; en dispatch usamos run_id.
          name: glyvex-appimage-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          # 3 dias: el artifact de cada tag es ~220 MB con nombre unico (no se
          # reemplaza); con la retention default de 90 dias varios tags
          # saturaban la cuota de storage de la cuenta (0.5 GB).
          retention-days: 3

      - name: Nota de release
        run: |
          echo "::notice::Descarga el artifact, copialo a Windows y corre build-latest-json.ps1 -LinuxBundle <dir> para generar latest.json con linux-x86_64 (el updater lo exige)."
